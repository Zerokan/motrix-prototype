<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motrix Operator Panel — Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#f3f6fb;--surface:#fff;--surface-2:#f7f9fc;--ink:#0f1a2e;--muted:#69758c;--line:#e6ebf3;
    --sidebar:#0D1B3E;--sidebar-2:#0a1530;--sidebar-ink:#aeb9d4;--sidebar-ink-2:#7c88a8;
    --primary:#E30A17;--primary-2:#ff3d4a;--primary-soft:#fdeaec;--navy:#0D1B3E;
    --ok:#15a34a;--ok-s:#e2f5e9;--warn:#c77b0a;--warn-s:#fbf0dc;--bad:#dc2626;--bad-s:#fce4e4;--info:#2563eb;--info-s:#e5edfd;
    --shadow:0 1px 2px rgba(15,26,46,.05),0 8px 26px rgba(15,26,46,.06);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:var(--sidebar);color:var(--sidebar-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:2rem}
  .brand{display:flex;align-items:center;gap:.5rem;padding:1.05rem 1.2rem;font-weight:800;font-size:1.12rem;color:#fff;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:var(--sidebar);z-index:2}
  .brand .b{color:var(--primary)} .brand small{font-weight:600;color:var(--sidebar-ink-2);font-size:.58rem;letter-spacing:.14em;display:block}
  .mod{margin-top:.2rem}
  .mod>.mh{display:flex;align-items:center;gap:.55rem;padding:.5rem 1.2rem;color:var(--sidebar-ink);font-weight:700;font-size:.83rem;cursor:pointer;user-select:none}
  .mod>.mh:hover{color:#fff} .mod>.mh .ic{width:16px;text-align:center;opacity:.85} .mod>.mh .ar{margin-left:auto;font-size:.6rem;opacity:.6;transition:.15s}
  .mod.open>.mh .ar{transform:rotate(90deg)} .mod.open>.mh{color:#fff}
  .sub{display:none;padding:.1rem 0 .3rem} .mod.open .sub{display:block}
  .sub a{display:block;padding:.34rem 1.2rem .34rem 2.5rem;color:var(--sidebar-ink-2);text-decoration:none;font-size:.79rem;cursor:pointer;border-left:3px solid transparent}
  .sub a:hover{color:#fff;background:rgba(255,255,255,.04)} .sub a.on{color:#fff;background:linear-gradient(90deg,rgba(227,10,23,.16),transparent);border-left-color:var(--primary)}
  /* topbar */
  .main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem}
  .crumb{font-size:.7rem;color:var(--muted);font-weight:600}.top h1{font-size:1.05rem;font-weight:750}
  .top .sp{flex:1}.search{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:.42rem .7rem;font-size:.8rem;min-width:180px;color:var(--ink)}
  .city{border:1px solid var(--line);border-radius:9px;padding:.42rem .7rem;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.4rem}.city .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem}
  .langdd{position:relative}.langtrig{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.4rem .6rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}.langtrig .ca{color:var(--muted);font-size:.7rem}
  .langmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:.3rem;min-width:168px;display:none;z-index:40}.langdd.open .langmenu{display:block}
  .langmenu button{display:flex;align-items:center;gap:.55rem;width:100%;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:.84rem;padding:.5rem .6rem;border-radius:8px;cursor:pointer;font-family:inherit;text-align:left}.langmenu button:hover{background:var(--surface-2)}.langmenu button.on{background:var(--primary-soft);color:var(--primary)}
  .content{padding:1.4rem 1.5rem 3rem}
  /* components */
  .grid{display:grid;gap:1rem}.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.card.pad{padding:1.1rem 1.2rem}
  .kpi{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.15rem}.kpi .l{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.kpi .n{font-size:1.7rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}.kpi .d{font-size:.72rem;font-weight:700}.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}
  .row{display:grid;gap:1rem;margin-top:1rem}.r-2{grid-template-columns:1.6fr 1fr}.r-3{grid-template-columns:repeat(3,1fr)}@media(max-width:1000px){.r-2,.r-3{grid-template-columns:1fr}}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border-bottom:1px solid var(--line)}.ch h3{font-size:.92rem;font-weight:750}.ch .sub{font-size:.72rem;color:var(--muted)}
  .btn{border:0;background:var(--primary);color:#fff;border-radius:9px;padding:.5rem .9rem;font-weight:700;font-size:.8rem;cursor:pointer;font-family:inherit}.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:.34rem .6rem;font-size:.74rem}
  .twrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:600px}
  thead th{text-align:left;font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.6rem .9rem;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:.58rem .9rem;border-bottom:1px solid var(--line)}tbody tr:hover{background:var(--surface-2)}tbody tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;align-items:center;gap:.32rem;border-radius:999px;padding:.13rem .55rem;font-size:.7rem;font-weight:700;white-space:nowrap}.pill .dot{width:6px;height:6px;border-radius:50%}
  .p-ok{background:var(--ok-s);color:var(--ok)}.p-ok .dot{background:var(--ok)}.p-warn{background:var(--warn-s);color:var(--warn)}.p-warn .dot{background:var(--warn)}.p-bad{background:var(--bad-s);color:var(--bad)}.p-bad .dot{background:var(--bad)}.p-info{background:var(--info-s);color:var(--info)}.p-info .dot{background:var(--info)}
  .batt{display:inline-flex;align-items:center;gap:.4rem}.batt .bar{width:44px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}.batt .bar i{display:block;height:100%}
  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.85rem 1rem;border-bottom:1px solid var(--line)}
  .chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:.3rem .7rem;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer}.chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .iconbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.75rem}.act{display:inline-flex;gap:.3rem}
  .form{display:grid;gap:.85rem;max-width:560px}.fld label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.04em}.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:.5rem .7rem;font-size:.85rem;color:var(--ink);font-family:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
  .tog{display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:.82rem;font-weight:600}.sw{width:34px;height:19px;border-radius:99px;background:var(--line);position:relative;flex:none}.sw.on{background:var(--primary)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff}.sw.on::after{left:17px}
  .tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);padding:0 1rem;flex-wrap:wrap}.tabs a{padding:.6rem .8rem;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tabs a.on{color:var(--primary);border-bottom-color:var(--primary)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:.5rem 1rem;padding:1.1rem 1.2rem;font-size:.85rem}.kv .k{color:var(--muted);font-weight:600}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}@media(max-width:1000px){.board{grid-template-columns:repeat(2,1fr)}}.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.7rem}.col h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.6rem;display:flex;justify-content:space-between}.tk{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.6rem .7rem;margin-bottom:.5rem;font-size:.8rem;box-shadow:var(--shadow)}.tk .m{color:var(--muted);font-size:.72rem;margin-top:.2rem}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .h{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:.3rem}.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:.35rem;font-size:.72rem}.cal .day .n{color:var(--muted);font-weight:700}.cal .ev{background:var(--primary-soft);color:var(--primary);border-radius:5px;padding:.1rem .3rem;font-size:.66rem;font-weight:700;margin-top:.2rem}
  #map{height:440px;border-radius:0 0 13px 13px;overflow:hidden}
  .mpin{width:24px;height:24px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.3);border:2px solid #fff}.mpin span{transform:rotate(-45deg);color:#fff;font-size:.68rem}
  .sectitle{font-size:.9rem;font-weight:750;margin:0 0 .5rem}.muted{color:var(--muted)}.note{font-size:.76rem;color:var(--muted)}
  .banner{background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;border-radius:12px;padding:.7rem 1.1rem;font-size:.8rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
  .sub a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 16%,transparent),transparent)}
  .accfab{position:fixed;right:1.2rem;bottom:1.2rem;background:#0D1B3E;border:1px solid #1e2c49;border-radius:16px;padding:.65rem .85rem;box-shadow:0 12px 34px rgba(15,26,46,.28);z-index:999}
  .accfab .lbl{color:#8ea0c6;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem}
  .accfab .dots{display:flex;gap:.5rem}
  .accfab button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .accfab button.on{border-color:#fff;box-shadow:0 0 0 2px #0D1B3E inset}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="b">⚡</span> MOTRIX <small>OPERATOR PANEL</small></div><div id="nav"></div></aside>
  <div class="main">
    <div class="top">
      <div><div class="crumb" id="crumb">Motrix · Kayseri</div><h1 id="ptitle">Dashboard</h1></div>
      <div class="sp"></div>
      <input class="search" placeholder="Suche…">
      <div class="city"><span class="dot"></span> Kayseri ▾</div>
      <div class="langdd" id="langdd"><button class="langtrig" id="langtrig"><span id="langflag">🇩🇪</span><span id="langname">Deutsch</span><span class="ca">▾</span></button>
        <div class="langmenu" id="langmenu"><button data-l="de" class="on">🇩🇪 Deutsch</button><button data-l="en">🇬🇧 English</button><button data-l="tr">🇹🇷 Türkçe</button></div></div>
      <div class="av">MK</div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ DATA MODEL: 14 modules · ~180 pages ============ */
const MODULES=[
 {id:"dash",ic:"▦",name:"Dashboard",pages:[["dash","Fleet Dashboard","dashboard"],["dash-live","Live-Ops-Snapshot","dashboard"],["dash-alerts","Alerts / Radar","list"],["dash-rev","Revenue-Snapshot","dashboard"],["dash-health","Ops-Health","dashboard"],["dash-saved","Saved-Views","list"]]},
 {id:"veh",ic:"🚲",name:"Vehicles / Fleet",pages:[["veh","Vehicle-Liste","list"],["veh-det","Vehicle-Detail","detail"],["veh-new","Vehicle Create/Edit","form"],["veh-imp","Bulk-Import / Provisioning","form"],["veh-types","Vehicle-Types","list"],["veh-type-new","Type Create","form"],["iot","IoT-Module","list"],["iot-det","IoT-Detail","detail"],["iot-assign","IoT-Assign","form"],["veh-fw","Firmware / OTA","list"],["veh-batt","Battery & Charging","dashboard"],["veh-cmd","Command-Console","form"],["veh-attr","Attribute-Groups","list"],["veh-cards","Vehicle-Cards (RFID)","list"]]},
 {id:"map",ic:"🗺️",name:"Live-Map",pages:[["map","Live-Map","map"]]},
 {id:"geo",ic:"⬡",name:"Geofences",pages:[["geo","Zonen-Map/Editor","map"],["geo-list","Zonen-Liste","list"],["geo-new","Zone-Create","form"],["geo-types","Area-Types","list"],["geo-sim","Zone-Simulation","map"],["st","Stations","list"],["st-new","Station-Create","form"],["st-slots","Physical-Stations/Slots","list"]]},
 {id:"rides",ic:"↻",name:"Rides / Rentals",pages:[["active","Active-Rides","list"],["rides","Ride-History","list"],["ride-det","Ride-Detail","detail"],["book","Bookings","list"],["book-cal","Booking-Kalender","calendar"],["book-new","Booking-Create","form"],["disp","Disputes","list"],["disp-det","Dispute-Detail","detail"],["refunds","Refunds","list"],["add","Rental-Additions","list"]]},
 {id:"users",ic:"👤",name:"Customers / Users",pages:[["users","Rider-Liste","list"],["user-det","Rider-Detail","detail"],["user-new","Rider Create/Edit","form"],["kyc","KYC / Verification-Queue","list"],["kyc-media","Media-Review","detail"],["idcards","Identity-Cards (RFID)","list"],["biz","Business-Accounts","list"],["biz-det","Business-Detail","detail"],["blk","Blacklist / Risk","list"]]},
 {id:"pricing",ic:"₺",name:"Pricing",pages:[["pricing","Pricing-Bundles","list"],["price-det","Bundle-Detail/Versionen","detail"],["price-new","Bundle Create/Edit","form"],["price-calc","Pricing-Calculator","form"],["price-sim","Pricing-Simulator","form"],["packages","Packages","list"],["subs","Subscriptions","list"]]},
 {id:"bill",ic:"🧾",name:"Billing & Payments",pages:[["txns","Transactions","list"],["wallets","Wallets/Balances","list"],["inv","Invoices","list"],["inv-det","Invoice-Detail","detail"],["inv-new","Invoice-Create","form"],["coll","Collections/Dunning","list"],["fines","Fines/Penalties","list"],["payouts","Payouts/Settlement","list"],["pgs","Payment-Gateways (ZeroPay)","form"],["revc","Revenue-Centers","list"],["efatura","e-Fatura / Uyumsoft [TR]","form"]]},
 {id:"ops",ic:"🛠",name:"Field Operations",pages:[["tasks","Task-Board","board"],["tasks-list","Task-Liste","list"],["task-new","Task-Create","form"],["task-tpl","Task-Templates","list"],["rebal","Rebalancing","map"],["swap","Battery-Swap","list"],["maint","Maintenance-Tickets","list"],["maint-det","Ticket-Detail","detail"],["dmg","Damage-Reports","list"],["workers","Service-Workers","list"],["routes","Routes/Dispatch","map"],["ware","Warehouse/Parts","list"]]},
 {id:"reports",ic:"📊",name:"Reports & BI",pages:[["reports","Revenue-Reports","dashboard"],["util","Utilization","dashboard"],["heat","Heatmaps","map"],["insights","Insights","dashboard"],["timeline","Timeline","list"],["esg","CO₂ / ESG","dashboard"],["muni","Municipal-Transparency","dashboard"],["custom","Custom-Dashboards","dashboard"],["exports","Data-Exports","list"]]},
 {id:"mkt",ic:"📣",name:"Marketing / CRM",pages:[["camp","Campaigns","list"],["push","Push-Create","form"],["banner","Banner-Ads","list"],["banner-new","Banner-Create","form"],["email","Email/SMS-Campaign","form"],["promo","Promotions/Vouchers","list"],["voucher-new","Voucher-Create","form"],["referral","Referral-Programm","dashboard"],["loyalty","Loyalty/Rewards","list"],["nchan","Notification-Channels","list"],["content","In-App-Content/Tutorials","list"]]},
 {id:"sup",ic:"💬",name:"Support & Safety",pages:[["tickets","Ticket-Inbox","list"],["ticket-det","Ticket-Detail","detail"],["sup-disp","Disputes","list"],["lost","Lost/Stolen-Recovery","map"],["safety","Safety-Events","list"],["fraud","Abuse/Fraud-Flags","list"],["comm","Community-Reports","list"],["issues","Issues","list"],["sos","SOS/Emergency-Log","list"]]},
 {id:"comp",ic:"🏛",name:"Compliance / City",pages:[["gbfs","GBFS-Feeds","form"],["mds","MDS-Feeds","form"],["policy","Policy-Management","list"],["permits","Permits/Caps","list"],["munirep","Municipal-Reporting","dashboard"],["audit","Audit-Log (KVKK)","list"],["terms","Terms&Conditions","list"],["privacy","Data/Privacy","form"]]},
 {id:"wl",ic:"🏷",name:"White-Label / Tenants",pages:[["tenants","Tenants/Städte","list"],["tenant-det","Tenant-Detail","detail"],["brand","Branding/Theme","form"],["flags","Feature-Flags/Settings","list"],["appcfg","App-Configuration","form"],["i18n","Message/Translation-Mgmt","list"],["maas","MaaS-Clients","list"]]},
 {id:"admin",ic:"⚙",name:"Administration",pages:[["staff","Staff/Team","list"],["staff-det","Staff-Detail","detail"],["invite","Invite","form"],["roles","Roles & Permissions","list"],["role-new","Role-Create","form"],["apikeys","API-Keys","list"],["webhooks","Webhooks","list"],["integr","Integrations","list"],["settings","General-Settings","form"],["profile","My-Profile / 2FA","form"]]}
];

/* ============ sample data ============ */
const IM=(i)=>"8632350803"+String(10+i).padStart(5,'0');
const NAMES=["Ahmet Y.","Elif K.","Mehmet T.","Zeynep A.","Can D.","Selin B.","Emre K.","Fatma S.","Burak Ö.","Deniz A.","Ayşe M.","Ali R."];
const STAT=[["ok","available"],["info","on-trip"],["ok","available"],["info","on-trip"],["warn","maintenance"],["ok","available"],["bad","offline"],["ok","available"]];
const FLEET=Array.from({length:12},(_,i)=>({qr:1769075161+i,imei:IM(i),model:"G7",batt:[80,74,91,63,18,88,0,55,72,44,96,31][i],st:STAT[i%8]}));

/* ============ pattern renderers ============ */
const battBar=b=>{const c=b<20?'var(--bad)':b<50?'var(--warn)':'var(--ok)';return `<span class="batt"><span class="bar"><i style="width:${b}%;background:${c}"></i></span>${b}%</span>`;};
const pill=(s,t)=>`<span class="pill p-${s}"><span class="dot"></span>${t}</span>`;

const arrow=d=>/^-/.test(d)?`<span class="d down">▼ ${d.slice(1)}</span>`:`<span class="d up">▲ ${d.replace('+','')}</span>`;
function pDashboard(p){const cfg=CFG[p[0]]||{};
  const k=cfg.k||[["Bikes online","56","+2"],["Aktive Fahrten","8","+3"],["Umsatz heute","₺2.480","+12%"],["Ø Batterie","76%","-4%"],["Auslastung","62%","+8%"]];
  return `<div class="grid kpis">${k.map(x=>`<div class="card kpi"><span class="l">${x[0]}</span><span class="n">${x[1]}</span>${x[2]?arrow(x[2]):''}</div>`).join('')}</div>
  <div class="row r-2"><div class="card"><div class="ch"><h3>${p[1]} · Verlauf</h3></div><div class="pad" data-chart="rev"></div></div>
  <div class="card"><div class="ch"><h3>Verteilung</h3></div><div class="pad" data-chart="bar"></div></div></div>
  <div class="row"><div class="card"><div class="ch"><h3>Letzte Aktivität</h3></div>${tableFleet(6)}</div></div>`;
}
function tableFleet(n){return `<div class="twrap"><table><thead><tr><th>QR</th><th>IMEI</th><th>Batterie</th><th>Status</th><th>Actions</th></tr></thead><tbody>${FLEET.slice(0,n).map(v=>`<tr><td class="mono">${v.qr}</td><td class="mono">${v.imei}</td><td>${battBar(v.batt)}</td><td>${pill(v.st[0],v.st[1])}</td><td class="act"><button class="iconbtn">📍</button><button class="iconbtn">🔓</button></td></tr>`).join('')}</tbody></table></div>`;}
function genCell(col,i){const c=col.toLowerCase();
  if(/actions?/.test(c))return `<span class="act"><button class="iconbtn">✎</button><button class="iconbtn">⋯</button></span>`;
  if(/status|aktiv$/.test(c))return pill(['ok','info','warn','ok','bad'][i%5],['aktiv','offen','wartet','aktiv','fehler'][i%5]);
  if(/batterie|battery/.test(c))return battBar([80,64,18,91,55,33,72,88][i%8]);
  if(/imei/.test(c))return `<span class="mono">${IM(i)}</span>`;
  if(/iccid/.test(c))return `<span class="mono">8990011${String(100000+i).slice(-6)}</span>`;
  if(/^key$|api.?key|schlüssel/.test(c))return `<span class="mono">mtx_${(1000+i).toString(16)}…${i}f2</span>`;
  if(/id|nr|nummer|ticket|ride|dispute|refund|export|flag|issue|sos|payout|permit|policy|banner|kampagne|code|slot/.test(c))return `<span class="mono">#${(2000+i*7)}</span>`;
  if(/datum|zeit|erstellt|aktualisiert|login|start|fällig|seit|gültig/.test(c))return `<span class="muted">2026-08-${((10+i)%27)+1}</span>`;

/* ============ charts + map hooks ============ */
function area(el,data,color){const w=560,h=150,p=8,max=Math.max(...data),min=Math.min(...data);const X=i=>p+i*(w-2*p)/(data.length-1),Y=v=>h-p-(v-min)/(max-min||1)*(h-2*p);let d=`M${X(0)},${Y(data[0])}`;data.forEach((v,i)=>d+=`L${X(i)},${Y(v)}`);el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:150px"><defs><linearGradient id="g${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(data.length-1)},${h}L${X(0)},${h}Z" fill="${color}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/></svg>`;}
function bars(el,data,color){const max=Math.max(...data);el.innerHTML=`<div style="display:flex;align-items:flex-end;gap:6px;height:150px">${data.map(v=>`<div style="flex:1;background:${color};opacity:.85;border-radius:4px 4px 0 0;height:${v/max*100}%"></div>`).join('')}</div>`;}
let mapInited=null;
function initMap(){const el=document.getElementById('map');if(!el||el._done)return;el._done=1;
  const m=L.map(el).setView([38.7225,35.4820],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  L.polygon([[38.7290,35.4720],[38.7300,35.4930],[38.7150,35.4950],[38.7135,35.4740]],{color:'#15a34a',weight:2,dashArray:'6 5',fillColor:'#15a34a',fillOpacity:.08}).addTo(m).bindTooltip('Service-Area · Millet Bahçeleri');
  L.polygon([[38.7248,35.4855],[38.7255,35.4890],[38.7228,35.4894],[38.7223,35.4858]],{color:'#dc2626',weight:2,dashArray:'6 5',fillColor:'#dc2626',fillOpacity:.12}).addTo(m).bindTooltip('No-Ride');
  L.polygon([[38.7198,35.4778],[38.7205,35.4815],[38.7178,35.4820],[38.7172,35.4782]],{color:'#c77b0a',weight:2,dashArray:'6 5',fillColor:'#c77b0a',fillOpacity:.12}).addTo(m).bindTooltip('Slow 10 km/h');
  const C={ok:'#15a34a',info:'#2563eb',warn:'#c77b0a',bad:'#dc2626'},G={ok:'⚡',info:'▶',warn:'🔋',bad:'!'};
  const pts=[[38.7248,35.4808,'ok'],[38.7222,35.4842,'info'],[38.7258,35.4792,'ok'],[38.7208,35.4818,'info'],[38.7235,35.4838,'ok'],[38.7192,35.4800,'warn'],[38.7250,35.4862,'ok'],[38.7188,35.4835,'bad'],[38.7240,35.4775,'warn'],[38.7215,35.4788,'ok']];
  pts.forEach((b,i)=>{L.marker([b[0],b[1]],{icon:L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,24],html:`<div class="mpin" style="background:${C[b[2]]}"><span>${G[b[2]]}</span></div>`})}).addTo(m).bindPopup(`<b>Bike ${IM(i).slice(-6)}</b><br>${IM(i)}<br>Millet Bahçeleri`);});
  setTimeout(()=>m.invalidateSize(),100);}

/* ============ router + nav ============ */
const PAGEMAP={}; MODULES.forEach(mo=>mo.pages.forEach(p=>PAGEMAP[p[0]]={...{},0:p[0],1:p[1],2:p[2],mod:mo}));
function buildNav(){document.getElementById('nav').innerHTML=MODULES.map(mo=>`<div class="mod${mo.id==='dash'?' open':''}" data-m="${mo.id}"><div class="mh"><span class="ic">${mo.ic}</span><span class="mn">${mo.name}</span><span class="ar">▶</span></div><div class="sub">${mo.pages.map(p=>`<a data-p="${p[0]}">${p[1]}</a>`).join('')}</div></div>`).join('');}
function go(id){const p=PAGEMAP[id];if(!p)return;const pg=[p[0],p[1],p[2]];
  document.getElementById('ptitle').textContent=p[1];
  document.getElementById('crumb').textContent="Motrix · Kayseri · "+p.mod.name;
  document.getElementById('view').innerHTML=(CUSTOM[id]||RENDER[p[2]])(pg);
  document.querySelectorAll('.sub a').forEach(a=>a.classList.toggle('on',a.dataset.p===id));
  const mo=document.querySelector(`.mod[data-m="${p.mod.id}"]`);if(mo&&!mo.classList.contains('open'))mo.classList.add('open');
  // hooks
  document.querySelectorAll('[data-chart="rev"]').forEach(el=>area(el,[120,140,135,160,175,150,190,210,185,220,205,240,235,268],getComputedStyle(document.documentElement).getPropertyValue('--primary')));
  document.querySelectorAll('[data-chart="bar"]').forEach(el=>bars(el,[8,12,6,15,10,18,9,14],getComputedStyle(document.documentElement).getPropertyValue('--navy')));
  if(p[2]==='map')initMap();
  const dt=document.getElementById('dtabs');if(dt)dt.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;dt.querySelectorAll('a').forEach(x=>x.classList.remove('on'));a.classList.add('on');const tp=a.dataset.tab;if(tp){const pnl=document.getElementById('dpanels');if(pnl)pnl.querySelectorAll('[data-panel]').forEach(pl=>pl.style.display=pl.dataset.panel===tp?'':'none');if(tp==='loc'){initMap();}}});
  window.scrollTo(0,0);
}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('.sub a');if(a){go(a.dataset.p);return;}const h=e.target.closest('.mh');if(h)h.parentElement.classList.toggle('open');});

function applyLang(l){const idx=l==='en'?0:l==='tr'?1:-1;
  document.querySelectorAll('.mod .mn').forEach(el=>{if(el.dataset.o===undefined)el.dataset.o=el.textContent;const o=el.dataset.o;el.textContent=idx<0?o:(TR[o]?TR[o][idx]:o);});
  const N={de:['🇩🇪','Deutsch'],en:['🇬🇧','English'],tr:['🇹🇷','Türkçe']};document.getElementById('langflag').textContent=N[l][0];document.getElementById('langname').textContent=N[l][1];
  document.querySelectorAll('#langmenu button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));}
const dd=document.getElementById('langdd');
document.getElementById('langtrig').addEventListener('click',e=>{e.stopPropagation();dd.classList.toggle('open');});
document.getElementById('langmenu').addEventListener('click',e=>{const b=e.target.closest('button');if(b){applyLang(b.dataset.l);dd.classList.remove('open');}});
document.addEventListener('click',()=>dd.classList.remove('open'));

function setAccent(c,c2){const r=document.documentElement.style;r.setProperty('--primary',c);r.setProperty('--primary-2',c2);r.setProperty('--primary-soft','color-mix(in srgb, '+c+' 12%, white)');document.querySelectorAll('.accfab button,[data-c]').forEach(x=>{if(x.dataset&&x.dataset.c!==undefined)x.classList.toggle('on',x.dataset.c===c);});}
const APALS=[["#E30A17","#ff3d4a","Motrix Rot"],["#0D1B3E","#24427a","Navy"],["#1cad6e","#22c98a","Grün"],["#0d9488","#14b8a6","Teal"],["#2563eb","#3b82f6","Mavi"],["#7c3aed","#9361f0","Mor"]];
const afab=document.createElement('div');afab.className='accfab';afab.innerHTML='<div class="lbl">Akzent · White-Label</div><div class="dots">'+APALS.map((p,i)=>`<button data-c="${p[0]}" onclick="setAccent('${p[0]}','${p[1]}')" title="${p[2]}" class="${i?'':'on'}" style="background:${p[0]}"></button>`).join('')+'</div>';document.body.appendChild(afab);

buildNav();go('dash');
</script>
