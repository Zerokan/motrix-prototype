<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motrix — Live-Map Kayseri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--navy:#0D1B3E;--primary:#E30A17;--ink:#0f1a2e;--muted:#69758c;--line:#e6ebf3;--surface:#fff;
    --ok:#15a34a;--info:#2563eb;--warn:#c77b0a;--bad:#dc2626;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:.4rem}
  .brand .b{color:var(--primary)}
  .brand small{color:#8ea0c6;font-weight:600;font-size:.62rem;letter-spacing:.14em;display:block}
  .bar .ti{font-weight:700;font-size:.9rem;opacity:.9}
  .bar .sp{flex:1}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#cdd7ee;border-radius:999px;padding:.28rem .7rem;font-size:.76rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:.35rem}
  .chip .d{width:8px;height:8px;border-radius:50%}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  #map{height:calc(100vh - 52px);width:100%;background:#e9eef5}
  /* markers */
  .mpin{width:26px;height:26px;border-radius:50% 50% 50% 2px;background:var(--c);transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35);border:2px solid #fff}
  .mpin span{transform:rotate(-45deg);color:#fff;font-size:.72rem;line-height:1}
  .lbl{background:var(--navy);color:#fff;border:0;border-radius:8px;font-size:.72rem;padding:.1rem .4rem}
  .leaflet-popup-content{margin:.7rem .9rem;font-size:.82rem}
  .pp b{font-size:.9rem} .pp .row{display:flex;justify-content:space-between;gap:1rem;margin:.25rem 0;color:var(--muted)}
  .pp .row b{color:var(--ink)}
  .pp .btns{display:flex;gap:.4rem;margin-top:.5rem}
  .pp button{border:0;border-radius:7px;padding:.35rem .6rem;font-weight:700;font-size:.74rem;cursor:pointer;font-family:inherit}
  .pp .u{background:var(--primary);color:#fff} .pp .l{background:#eef1f6;color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.05rem .45rem;font-size:.7rem;font-weight:700}
  .pill .d{width:6px;height:6px;border-radius:50%}
  .stat{position:absolute;left:12px;bottom:20px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;box-shadow:0 6px 24px rgba(15,26,46,.15);min-width:180px}
  .stat h4{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem}
  .stat .r{display:flex;justify-content:space-between;font-size:.8rem;margin:.2rem 0}
  .stat .r b{font-variant-numeric:tabular-nums}
  .legend{position:absolute;right:12px;bottom:20px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;box-shadow:0 6px 24px rgba(15,26,46,.15);font-size:.74rem}
  .legend .r{display:flex;align-items:center;gap:.5rem;margin:.22rem 0}
  .legend .sw{width:12px;height:12px;border-radius:3px}
</style>
</head>
<body>
  <div class="bar">
    <div class="brand"><span class="b">⚡</span> MOTRIX <small>OPERATOR</small></div>
    <span class="ti">Live-Map · Kayseri</span>
    <span class="sp"></span>
    <div class="chips" id="chips">
      <span class="chip on" data-f="all"><span class="d" style="background:#fff"></span>Alle</span>
      <span class="chip" data-f="ok"><span class="d" style="background:var(--ok)"></span>Available</span>
      <span class="chip" data-f="trip"><span class="d" style="background:var(--info)"></span>On-Trip</span>
      <span class="chip" data-f="warn"><span class="d" style="background:var(--warn)"></span>Low-Batt</span>
      <span class="chip" data-f="bad"><span class="d" style="background:var(--bad)"></span>Offline</span>
    </div>
  </div>
  <div style="position:relative">
    <div id="map"></div>
    <div class="stat">
      <h4>Flotte · Kayseri</h4>
      <div class="r"><span>Bikes online</span><b>56</b></div>
      <div class="r"><span>Auf Fahrt</span><b style="color:var(--info)">8</b></div>
      <div class="r"><span>Low-Battery</span><b style="color:var(--warn)">3</b></div>
      <div class="r"><span>Offline</span><b style="color:var(--bad)">1</b></div>
    </div>
    <div class="legend">
      <div class="r"><span class="sw" style="background:rgba(21,163,74,.35);border:1px solid var(--ok)"></span>Service-Area (Millet Bahçeleri)</div>
      <div class="r"><span class="sw" style="background:rgba(220,38,38,.3);border:1px solid var(--bad)"></span>No-Ride-Zone</div>
      <div class="r"><span class="sw" style="background:rgba(199,123,10,.3);border:1px solid var(--warn)"></span>Slow-Zone (10 km/h)</div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COL={ok:'#15a34a',trip:'#2563eb',warn:'#c77b0a',bad:'#dc2626'};
const GLY={ok:'⚡',trip:'▶',warn:'🔋',bad:'!'};
const map=L.map('map',{zoomControl:true}).setView([38.7225,35.4820],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);

// --- Geofence zones ---
const service=L.polygon([[38.7290,35.4720],[38.7300,35.4930],[38.7150,35.4950],[38.7135,35.4740]],
  {color:'#15a34a',weight:2,dashArray:'6 5',fillColor:'#15a34a',fillOpacity:.08}).addTo(map).bindTooltip('Service-Area · Millet Bahçeleri');
const noride=L.polygon([[38.7248,35.4855],[38.7255,35.4890],[38.7228,35.4894],[38.7223,35.4858]],
  {color:'#dc2626',weight:2,dashArray:'6 5',fillColor:'#dc2626',fillOpacity:.12}).addTo(map).bindTooltip('No-Ride-Zone');
const slow=L.polygon([[38.7198,35.4778],[38.7205,35.4815],[38.7178,35.4820],[38.7172,35.4782]],
  {color:'#c77b0a',weight:2,dashArray:'6 5',fillColor:'#c77b0a',fillOpacity:.12}).addTo(map).bindTooltip('Slow-Zone · max 10 km/h');

// --- Fleet ---
const IMEIS=["863235080301854","863235080208943","863235080300997","863235080374687","863235080301821","863235080205550","863235080208844","863235080263427","863235080300997","863235080301999"];
const BIKES=[
 [38.7248,35.4808,'ok',80],[38.7222,35.4842,'trip',64],[38.7258,35.4792,'ok',91],[38.7208,35.4818,'trip',52],
 [38.7235,35.4838,'ok',77],[38.7192,35.4800,'warn',15],[38.7250,35.4862,'ok',88],[38.7215,35.4788,'ok',55],
 [38.7188,35.4835,'bad',0],[38.7240,35.4775,'warn',18]
];
const markers=[];
BIKES.forEach((b,i)=>{
  const [lat,lng,st,bat]=b; const im=IMEIS[i];
  const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],
    html:`<div class="mpin" style="--c:${COL[st]}"><span>${GLY[st]}</span></div>`});
  const label={ok:'available',trip:'on-trip',warn:'low-battery',bad:'offline'}[st];
  const m=L.marker([lat,lng],{icon}).addTo(map);
  m._st=st;
  m.bindPopup(`<div class="pp"><b>Bike ${im.slice(-6)}</b>
    <div class="row"><span>IMEI</span><b>${im}</b></div>
    <div class="row"><span>Batterie</span><b>${bat}%</b></div>
    <div class="row"><span>Status</span><span class="pill" style="background:${COL[st]}22;color:${COL[st]}"><span class="d" style="background:${COL[st]}"></span>${label}</span></div>
    <div class="row"><span>Zone</span><b>Millet Bahçeleri</b></div>
    <div class="btns"><button class="u">🔓 Unlock</button><button class="l">🔔 Locate</button><button class="l">🔒 Lock</button></div></div>`);
  markers.push(m);
});
map.fitBounds(service.getBounds().pad(0.15));

// --- Filter ---
document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  const f=c.dataset.f;
  markers.forEach(m=>{ const show=f==='all'||m._st===f; if(show)m.addTo(map); else map.removeLayer(m); });
});
</script>
</body>
</html>
